name: Dotfile setup

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  symlinks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tests/makesymlinks.sh
